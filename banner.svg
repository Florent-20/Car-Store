<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="Car Store website banner" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1218"/>
      <stop offset="0.6" stop-color="#1c2633"/>
      <stop offset="1" stop-color="#3a1620"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff4d5a"/>
      <stop offset="1" stop-color="#c1121f"/>
    </linearGradient>
  </defs>

  <!-- background -->
  <rect width="1200" height="300" rx="24" fill="url(#bg)"/>
  <circle cx="980" cy="90" r="170" fill="#e63946" opacity="0.08"/>

  <!-- title -->
  <text x="60" y="140" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="96" font-weight="900" letter-spacing="3" fill="#ffffff">CAR <tspan fill="#ff4d5a">STORE</tspan></text>
  <text x="62" y="190" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="32" font-weight="600" fill="#ffb3b9">Browse. Choose. Drive.</text>
  <rect x="62" y="215" width="330" height="34" rx="17" fill="#ffffff" opacity="0.1"/>
  <text x="227" y="238" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" font-weight="600" fill="#e6edf5">HTML &amp; CSS  •  In Development</text>

  <!-- road -->
  <rect x="650" y="238" width="550" height="62" fill="#0a0e13" opacity="0.7"/>
  <g stroke="#ffffff" stroke-width="4" stroke-linecap="round" opacity="0.35">
    <line x1="670" y1="272" x2="730" y2="272"/>
    <line x1="780" y1="272" x2="840" y2="272"/>
    <line x1="890" y1="272" x2="950" y2="272"/>
    <line x1="1000" y1="272" x2="1060" y2="272"/>
    <line x1="1110" y1="272" x2="1170" y2="272"/>
  </g>

  <!-- speed lines -->
  <g stroke="#ffffff" stroke-width="4" stroke-linecap="round" opacity="0.25">
    <line x1="700" y1="150" x2="770" y2="150"/>
    <line x1="720" y1="175" x2="780" y2="175"/>
    <line x1="690" y1="200" x2="765" y2="200"/>
  </g>

  <!-- car -->
  <g transform="translate(800,112) scale(1.1)">
    <path d="M10,80 L10,62 Q10,52 24,48 L70,40 L105,12 Q110,6 120,6 L225,6 Q238,6 246,14 L280,42 L330,50 Q350,54 350,68 L350,80 Z" fill="url(#body)"/>
    <polygon points="116,16 168,16 168,42 94,42" fill="#cfe8ff" opacity="0.9"/>
    <polygon points="176,16 224,16 254,42 176,42" fill="#cfe8ff" opacity="0.9"/>
    <rect x="336" y="56" width="14" height="9" rx="3" fill="#ffd166"/>
    <rect x="10" y="58" width="10" height="9" rx="3" fill="#ff9f1c"/>
    <line x1="168" y1="16" x2="168" y2="80" stroke="#8b0d18" stroke-width="2" opacity="0.6"/>
    <rect x="176" y="56" width="22" height="5" rx="2.5" fill="#8b0d18" opacity="0.8"/>
    <g>
      <circle cx="85" cy="84" r="27" fill="#0b0b0f" stroke="#2b2f36" stroke-width="3"/>
      <circle cx="85" cy="84" r="12" fill="#c9d1d9"/>
      <circle cx="85" cy="84" r="4" fill="#0b0b0f"/>
      <circle cx="275" cy="84" r="27" fill="#0b0b0f" stroke="#2b2f36" stroke-width="3"/>
      <circle cx="275" cy="84" r="12" fill="#c9d1d9"/>
      <circle cx="275" cy="84" r="4" fill="#0b0b0f"/>
    </g>
  </g>
</svg>
